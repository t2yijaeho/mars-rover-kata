[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

[project]
name = "mars-rover-kata"
version = "1.0.0"
description = "Interactive Mars Rover KATA with a verified autopilot and optional OpenAI agent."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "t2yijaeho" }]
dependencies = [
  "fastapi>=0.141.1,<1",
  "openai-agents>=0.18,<1",
  "pydantic>=2.13,<3",
  "uvicorn[standard]>=0.52.0,<1",
]

[dependency-groups]
dev = [
  "bandit>=1.9,<2",
  "httpx>=0.28,<1",
  "pip-audit>=2.9,<3",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.16.1,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mars_rover"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=mars_rover --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
